services:
  - type: web
    name: loompad
    runtime: python
    plan: starter
    buildCommand: ""
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    envVars:
      - key: NOTION_HOST
        value: "0.0.0.0"
      - key: NOTION_HTTPS
        value: "1"
      - key: NOTION_DB_PATH
        value: "/var/data/notion.db"
    disk:
      name: notion-sqlite-data
      mountPath: /var/data
      sizeGB: 1
